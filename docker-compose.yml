version: '3.8'

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: portfolio_dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - WDS_SOCKET_PORT=0
      - CHOKIDAR_USEPOLLING=true  # Necesario para detectar cambios en Windows/WSL
      - WATCHPACK_POLLING=true
    stdin_open: true # Permite que react-scripts no se detenga
    tty: true